<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base with Metallic Amber Rim -->
  <rect x="0.8" y="0.8" width="30.4" height="30.4" rx="8" fill="#121316" stroke="url(#rimGrad)" stroke-width="1.6"/>

  <!-- Core Ambient Glow -->
  <circle cx="16" cy="16" r="8" fill="url(#haloGlow)"/>

  <!-- Left Bracket < -->
  <path d="M 10.5 10.5 L 5.5 16 L 10.5 21.5" stroke="#f97316" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Bracket > -->
  <path d="M 21.5 10.5 L 26.5 16 L 21.5 21.5" stroke="#f97316" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Lightning Bolt ⚡ -->
  <path d="M 18.2 8.8 L 13.4 15.4 H 18.2 L 13.8 23.2" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
